<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandarin · Tone Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="card">
      <div class="card-title">📚 Question Sets</div>
      <ul class="set-list" id="setList">
        <li class="loading">Loading sets…</li>
      </ul>
    </div>
    <div class="card mistake-card">
      <div class="card-title">🔁 Review Mistakes</div>
      <div id="mistakeContent">
        <div class="empty-mistakes">No mistakes yet — keep it up! ✨</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="app">
      <header class="top">
        <div><div class="eyebrow" id="eyebrow">Mandarin · Basic Vocabulary</div><h1 class="title" id="mainTitle">Tone Practice</h1></div>
        <div class="counter" id="counter">— / —</div>
      </header>
      <section class="panel">
        <div id="errorBox"></div>
        <div class="modes">
          <button class="mode active" id="mode1" type="button">Character → Pinyin</button>
          <button class="mode" id="mode2" type="button">Pinyin → Character</button>
        </div>
        <div id="quiz">
          <div class="progress-meta"><span id="progressLabel">Round progress</span><span id="scoreLabel">0 correct</span></div>
          <div class="track"><div class="bar" id="bar"></div></div>
          <div class="prompt">
            <div class="prompt-label" id="promptLabel">What is the correct pinyin?</div>
            <div class="hanzi" id="hanzi">—</div>
            <div class="pinyin" id="pinyin" hidden></div>
            <div class="meaning" id="meaning"></div>
          </div>
          <div class="options" id="options"></div>
          <div class="feedback" id="feedback" aria-live="polite">Loading…</div>
          <div class="actions">
            <button class="secondary" id="restart" type="button">Restart</button>
            <button class="primary" id="next" type="button" disabled>Next →</button>
          </div>
        </div>
        <div class="done" id="done" hidden>
          <div class="big">完成！</div><h2>Round complete!</h2><p id="result"></p>
          <button class="primary" id="again" type="button">Practice again</button>
        </div>
      </section>
      <div class="footer"><span id="footerInfo">— words · 4 options per question</span><span><span class="kbd">←</span> Restart anytime</span></div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
